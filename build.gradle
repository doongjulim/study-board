plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    implementation 'org.flywaydb:flyway-core'
    // 마크다운: 렌더링(commonmark)과 살균(jsoup)을 나눠서 쓴다.
    // 렌더러는 원본에 든 HTML 을 그대로 통과시키므로, 살균을 거치지 않으면 그대로 XSS 가 된다.
    implementation 'org.commonmark:commonmark:0.22.0'
    implementation 'org.jsoup:jsoup:1.18.1'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    runtimeOnly 'com.h2database:h2'
    // 운영 DB. 드라이버가 있어도 URL 이 h2 면 쓰이지 않으므로, 이미지 하나로 두 DB 를 다 띄울 수 있다.
    // Flyway 10 부터 DB 별 지원이 별도 모듈로 빠져, PostgreSQL 은 이것이 있어야 마이그레이션이 돈다
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // E2E: 실제 브라우저로 화면을 눌러 본다. Node 툴체인 대신 Java 바인딩을 쓰는 이유는
    // 빌드가 하나로 유지되고, CI 에 npm 단계를 더하지 않아도 되기 때문이다
    testImplementation 'com.microsoft.playwright:playwright:1.47.0'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform {
        // E2E 는 브라우저를 내려받고 앱을 띄우므로 기본 test 에서 뺀다.
        // ./gradlew test 가 느려지거나 네트워크 없이는 실패하는 순간, 사람들은 테스트를 안 돌리게 된다
        excludeTags 'e2e'
    }
}

/**
 * 실제 브라우저로 도는 테스트. 처음 한 번은 브라우저를 내려받는다(수백 MB).
 *
 *   ./gradlew e2eTest
 */
tasks.register('e2eTest', Test) {
    description = '실제 브라우저로 핵심 흐름을 확인한다'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'e2e'
    }
    // 브라우저가 뜨는 시간이 있어 단위 테스트보다 오래 걸린다 - 실패를 빨리 보려면 로그가 필요하다
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
}
