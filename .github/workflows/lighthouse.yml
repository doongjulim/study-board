# 접근성·성능이 조용히 나빠지는 것을 막는다.
#
# 이 프로젝트는 화면 규칙을 문서와 테스트로 꽤 지켜 왔지만(CLAUDE.md 의 '화면 규칙'),
# 그 규칙들은 "무엇을 그리는가" 에 관한 것이다. 대비가 모자란 색 하나, 라벨 없는 버튼 하나,
# 200KB 짜리 이미지 하나는 어느 테스트에도 걸리지 않고 들어온다 - 그리고 들어온 뒤에는
# 아무도 알아차리지 못한다. 사람이 잊지 않아야 지켜지는 규칙은 언젠가 잊힌다는,
# 이 저장소가 이미 여러 번 적어 둔 그 이유다.
#
# 로그인 없이 열리는 화면만 본다. 로그인 뒤 화면까지 보려면 CI 에 계정과 쿠키를 심어야 하는데,
# 그 복잡함에 비해 얻는 것이 크지 않다 - 헤더·푸터·색·폰트·스크립트는 어차피 모든 화면이 공유한다.
#
# 기준선(.lighthouserc.json):
#   접근성 0.95 는 error 다. 라벨 없는 버튼·모자란 대비는 규칙이 분명하고 CI 에서 흔들리지 않는다.
#   성능 0.85 는 warn 이다. 공용 러너는 실행마다 편차가 커서 error 로 두면 관계없는 PR 이 막히고,
#   그러면 사람들은 경고를 끄는 대신 검사 자체를 지운다.
name: Lighthouse

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 준비
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      - name: 애플리케이션 빌드
        run: ./gradlew bootJar --no-daemon -x test

      # 뜰 때까지 기다린 뒤에 측정한다 - 부팅 중에 재면 전부 실패로 나온다
      - name: 애플리케이션 실행
        run: |
          java -jar build/libs/*-SNAPSHOT.jar > app.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/login > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "애플리케이션이 뜨지 않았다"; cat app.log; exit 1

      - name: Lighthouse 실행
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: .lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
