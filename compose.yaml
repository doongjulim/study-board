# PostgreSQL 로 띄워 보는 구성.
#
# 로컬 개발은 여전히 H2 파일 DB 로 충분하다. 이 파일은 "운영과 같은 DB 에서 정말 도는가" 를
# 확인할 때 쓴다 - 마이그레이션 호환은 CI 가 보지만, 화면까지 붙여서 보고 싶을 때가 있다.
#
#   docker compose up --build
#
# 주의: JWT_SECRET 은 예시값이다. 실제 배포에서는 반드시 다른 값으로 바꾼다.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: studyboard
      POSTGRES_USER: studyboard
      POSTGRES_PASSWORD: studyboard
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    # 앱이 DB 보다 먼저 떠서 연결에 실패하는 일을 막는다
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # 드라이버 클래스는 URL 에서 유추된다 - 여기서 DB 를 바꾸는 것으로 전환이 끝난다
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/studyboard
      SPRING_DATASOURCE_USERNAME: studyboard
      SPRING_DATASOURCE_PASSWORD: studyboard
      JWT_SECRET: compose-only-secret-key-please-override-me!
      APP_BASE_URL: http://localhost:8080
    ports:
      - "8080:8080"
    volumes:
      # 첨부파일은 컨테이너를 지워도 남아야 한다 (근본 해결은 S3 전환)
      - uploads:/app/uploads

volumes:
  db-data:
  uploads:
