spring:
  flyway:
    enabled: false   # 테스트는 인메모리 + create-drop 으로 스키마 생성
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

file:
  upload-dir: ${java.io.tmpdir}/board-test-uploads/
