# ⚠ 이 파일은 main 의 application.yml 을 '덮어쓰는' 것이 아니라 '가린다'.
# 클래스패스에 같은 이름이 둘이면 앞의 것만 읽히므로, main 에만 적어 둔 설정은 테스트에 하나도
# 적용되지 않는다 (open-in-view 경고가 그 증거다). 그래서 운영과 같아야 하는 설정은 여기에도 적는다.
# 프로파일 오버레이로 바꾸는 것이 옳지만, 테스트 전체의 기준 설정이 바뀌는 일이라 따로 다룬다.
spring:
  flyway:
    enabled: false   # 테스트는 인메모리 + create-drop 으로 스키마 생성
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

server:
  servlet:
    session:
      # main 과 같은 값. 주소에 ;jsessionid= 가 붙으면 E2E 가 그 자리에서 400 을 맞는다
      tracking-modes: cookie

file:
  upload-dir: ${java.io.tmpdir}/board-test-uploads/

jwt:
  secret: test-only-secret-key-must-be-32-bytes-min!
  access-token-minutes: 15
  refresh-token-days: 14
