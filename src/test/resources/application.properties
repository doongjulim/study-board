# 테스트는 'test' 프로파일로 돈다.
#
# 이 한 줄이 여기 있는 이유: 예전에는 src/test/resources/application.yml 이 운영 설정 파일과
# 이름이 같아, 덮어쓰는 것이 아니라 통째로 가리고 있었다. 클래스패스에 같은 이름이 둘이면
# 앞의 것만 읽히기 때문이다. 그래서 main 에만 적어 둔 설정 - open-in-view 를 끄는 것, 세션 아이디를
# 주소에 붙이지 않는 것 - 이 테스트에서는 하나도 적용되지 않았고, 테스트는 운영과 다른 앱을 검증하고 있었다.
#
# 이름이 다르면 가리지 않는다. 그래서 이 파일은 프로파일만 켜고, 실제 차이는 application-test.yml
# 에 '덮어쓸 것만' 적는다. 나머지는 운영 설정이 그대로 내려온다.
#
# properties 파일로 둔 것은 IDE 에서 테스트를 하나만 돌릴 때도 자동으로 적용되게 하기 위해서다 -
# 빌드 스크립트에 넣으면 Gradle 로 돌릴 때만 켜져, IDE 와 CI 가 서로 다른 앱을 보게 된다.
spring.profiles.active=test
