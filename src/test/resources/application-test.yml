# 운영 설정(main 의 application.yml)에서 <b>달라야 하는 것만</b> 적는다.
# 적지 않은 것은 전부 운영 값이 그대로 내려온다 - 그래야 테스트가 검증하는 앱과
# 실제로 뜨는 앱이 같은 물건이 된다.
spring:
  datasource:
    # 파일이 아니라 메모리. 테스트가 남긴 데이터가 다음 실행으로 새지 않는다
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      # 스키마는 아래 flyway 대신 엔티티에서 만든다 - 매 실행 새 DB 라 이력을 쌓을 이유가 없다
      ddl-auto: create-drop
  flyway:
    # 마이그레이션 자체의 검증은 SchemaMigrationTest 가 Flyway API 를 직접 불러 따로 한다.
    # 모든 테스트가 매번 21개를 다시 돌 이유는 없다
    enabled: false

file:
  # 사용자 홈을 건드리지 않는다
  upload-dir: ${java.io.tmpdir}/board-test-uploads/

jwt:
  # 운영은 환경변수로 주입한다. 테스트는 값이 무엇이든 상관없지만 32바이트는 넘어야 한다
  secret: test-only-secret-key-must-be-32-bytes-min!
