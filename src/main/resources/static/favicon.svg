  <rect width="64" height="64" rx="14" fill="#2f6b4f"/>
  <path d="M18 33.3 L28.2 43.5 L47.4 21.1" fill="none" stroke="#ffffff"
        stroke-width="7.7" stroke-linecap="round" stroke-linejoin="round"/>
