<!--
  탭 파비콘. tools/generate_icons.py 가 그리는 마크와 같은 그림을 벡터로 적은 것이다.
  SVG 를 먼저 두는 이유: 한 장으로 모든 크기에 맞고, 다크 모드에서도 흐려지지 않는다.
  읽지 못하는 브라우저는 뒤에 선언한 favicon.ico 로 내려온다.
  색을 바꿀 때는 여기와 tools/generate_icons.py 를 함께 바꾼다 (tokens.css 의 --accent).
-->
