<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 모든 페이지 공통 헤더: 내비게이션 + 다크모드 + 실시간 알림 벨 -->
<!-- data-csrf-*: JS fetch 가 POST 시 사용할 CSRF 토큰 (notification.js 참고) -->
<header class="site" th:fragment="siteHeader(active)"
        th:attr="data-csrf-token=${_csrf != null ? _csrf.token : ''},data-csrf-header=${_csrf != null ? _csrf.headerName : ''}">
    <div class="container">
        <a th:href="@{/}" class="brand">🎯 스터디플랜</a>
        <nav class="gnb">
            <a th:href="@{/}" th:classappend="${active == 'home'} ? 'on'">홈</a>
            <a th:href="@{/plans/daily}" th:classappend="${active == 'plans'} ? 'on'">플래너</a>
            <a th:href="@{/ddays}" th:classappend="${active == 'ddays'} ? 'on'">D-Day</a>
            <a th:href="@{/stats}" th:classappend="${active == 'stats'} ? 'on'">통계</a>
            <a th:href="@{/plans/shared}" th:classappend="${active == 'shared'} ? 'on'">공유 플랜</a>
            <a th:href="@{/posts}" th:classappend="${active == 'posts'} ? 'on'">게시판</a>
        </nav>
        <div class="header-controls">
            <!-- 진행 중인 학습 타이머: 페이지를 옮겨도 유지되도록 헤더에 둔다 (timer.js 가 채운다) -->
            <div id="timer-box" class="timer-box" th:if="${currentMember != null}" hidden>
                <span id="timer-label" class="timer-label">학습 중</span>
                <span id="timer-clock" class="timer-clock">00:00:00</span>
                <button id="timer-stop" type="button" class="timer-stop" aria-label="학습 종료">⏹</button>
            </div>
            <div class="auth-menu" th:if="${currentMember != null}">
                <a class="nickname" th:href="@{/me}" th:text="${currentMember.nickname} + '님'">닉네임</a>
                <form th:action="@{/logout}" method="post" class="inline-form">
                    <button type="submit" class="btn btn-sm">로그아웃</button>
                </form>
            </div>
            <div class="auth-menu" th:if="${currentMember == null}">
                <a class="btn btn-sm" th:href="@{/login}">로그인</a>
                <a class="btn btn-sm" th:href="@{/signup}">회원가입</a>
            </div>
            <button id="theme-toggle" type="button" class="theme-btn" aria-label="다크 모드로 전환">🌙</button>
            <div class="notif" th:if="${currentMember != null}">
                <button id="notif-bell" type="button" class="bell" aria-label="알림">
                    🔔<span id="notif-badge" class="badge" hidden></span>
                </button>
                <div id="notif-panel" class="notif-panel" hidden>
                    <div class="notif-head">알림</div>
                    <ul id="notif-list"></ul>
                </div>
            </div>
        </div>
    </div>
    <div id="toast-box" class="toast-box"></div>
    <script th:src="@{/js/theme.js}" defer></script>
    <script th:src="@{/js/notification.js}" defer></script>
    <script th:src="@{/js/timer.js}" defer></script>
</header>
</body>
</html>
