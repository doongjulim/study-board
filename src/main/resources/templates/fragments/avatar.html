<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  회원 아바타. 댓글·그룹 멤버·순위표가 함께 쓴다.

  사진이 없으면 요청을 보내지 않고 닉네임 첫 글자로 대신 그린다 - 대부분의 회원은 사진이 없는데
  그때마다 404 를 받아 오면 목록 하나에 요청이 수십 번 나간다. 그래서 "사진이 있는가" 를
  화면까지 들고 온다(순위표의 Row 가 hasProfileImage 를 함께 드는 이유다).
-->

<!-- 기본형: 값만 받는다. 엔티티가 없는 자리(순위표)에서도 쓸 수 있다 -->
<span th:fragment="avatarOf(memberId, nickname, hasImage, size)"
      class="avatar" th:classappend="'avatar-' + ${size}">
    <img th:if="${hasImage}"
         th:src="@{/members/{id}/avatar(id=${memberId})}"
         th:alt="${nickname} + ' 프로필 사진'" loading="lazy">
    <!-- 글자 아바타는 장식이라 스크린리더가 읽을 필요가 없다. 이름은 옆에 이미 있다 -->
    <span th:unless="${hasImage}" class="avatar-initial" aria-hidden="true"
          th:text="${nickname == null or nickname.isEmpty()} ? '?' : ${nickname.substring(0, 1)}">닉</span>
</span>

<!-- 편의형: Member 를 그대로 넘긴다 -->
<span th:fragment="avatar(member, size)"
      th:replace="~{fragments/avatar :: avatarOf(${member.id}, ${member.nickname}, ${member.hasProfileImage()}, ${size})}"></span>
</body>
</html>
