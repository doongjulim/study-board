<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  남은 날짜 칩 줄 - 홈과 일간 뷰가 함께 쓴다.

  왜 프래그먼트로 두나 - 같은 줄이 두 화면에 손으로 적혀 있었고, 여기에 지원 마감이 더해지면
  세 벌째가 생길 참이었다. 일정 한 줄에서 이미 겪은 일이다(plans/row.html).

  왜 D-Day 와 지원 마감을 한 줄에 두나 - 사용자에게는 둘 다 "곧 다가오는 날" 하나다.
  따로 두면 화면을 두 번 훑어야 하고, 무엇이 더 급한지는 그때 알 수 없다.
  모양이 같아야 하는 이유이기도 하다 - 나란히 놓인 값이 다르게 생기면 다른 것으로 읽힌다.

  필요한 인자: ddays, applications, today
-->
<div th:fragment="deadlineStrip(ddays, applications, today)" class="dday-strip"
     th:if="${!ddays.isEmpty() or !applications.isEmpty()}">
    <a class="dday-chip" th:each="dday : ${ddays}" th:href="@{/ddays}">
        <span class="dday-badge" th:text="${dday.label(today)}">D-0</span>
        <span th:text="${dday.title}">제목</span>
    </a>
    <!--
      지원 마감은 회사 이름과 단계를 함께 적는다 - "D-3 카카오" 만으로는
      서류 마감인지 면접 날짜인지 알 수 없어, 결국 지원 현황을 열어 봐야 한다.
    -->
    <a class="dday-chip" th:each="app : ${applications}" th:href="@{/applications}">
        <span class="dday-badge" th:classappend="${app.isUpcoming(today, 3)} ? 'urgent'"
              th:text="${app.deadlineLabel(today)}">D-0</span>
        <span th:text="${app.company}">회사</span>
        <span class="tag-stage" th:text="${app.stage.label}">단계</span>
    </a>
</div>
</body>
</html>
