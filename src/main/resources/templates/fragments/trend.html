<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  일별 추이 막대.

  홈 대시보드와 통계 대시보드가 같은 그림을 그린다. 예전에는 마크업이 두 벌이었고,
  이미 갈라져 있었다 - 통계 쪽 말풍선은 "3/5 완료 · 2시간 30분" 인데 홈 쪽은 "2시간 30분" 뿐이었다.
  같은 막대를 보면서 화면마다 다른 설명을 듣는 셈이다. 자세한 쪽으로 맞춰 하나로 모았다.

  필요한 것: days (List<StudyStatistics.DailyStat>)

  막대 높이는 서버가 계산한다(barHeight). 화면이 다시 계산하면 두 곳의 기준이 갈린다.
-->
<div th:fragment="trendChart(days)" class="trend-chart">
    <div class="trend-col" th:each="day : ${days}">
        <!--
          말풍선에만 수치를 두지 않는다 - 터치 화면에는 hover 가 없다.
          그래서 aria-label 로도 같은 내용을 싣고, 막대 자체는 장식으로 둔다.
        -->
        <div class="trend-bar-wrap" tabindex="0"
             th:with="summary=${day.isEmpty()}
                      ? '기록 없음'
                      : (${day.completedCount} + '/' + ${day.totalCount} + ' 완료 · '
                         + ${day.readableActual()})"
             th:title="${summary}"
             th:attr="aria-label=${#temporals.format(day.date, 'M/d')} + ' ' + ${summary}">
            <div class="trend-bar" th:unless="${day.isEmpty()}" aria-hidden="true"
                 th:classappend="${day.completionRate() == 0} ? 'pending'"
                 th:style="'height:' + ${day.barHeight()} + '%'"></div>
        </div>
        <span class="trend-label" aria-hidden="true"
              th:text="${#temporals.format(day.date, 'M/d')}">날짜</span>
    </div>
</div>
</body>
</html>
