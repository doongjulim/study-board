<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  일간 플래너의 한 줄.

  왜 프래그먼트로 뺐나 - 같은 줄을 만드는 코드가 daily.html 과 plans.js 두 곳에 있었다.
  JS 쪽이 뒤처져서, 한 줄 입력으로 방금 추가한 일정에는 공유·삭제 버튼이 없었다(새로고침해야 생겼다).
  이제 마크업은 여기 하나뿐이고, JS 는 이 프래그먼트를 서버에서 받아 끼워 넣기만 한다
  (PlanController 의 GET /plans/{id}/row).

  필요한 컨텍스트 변수: plan, shareScopes

  data-start 는 JS 가 삽입 위치를 정할 때 쓴다. 서버 정렬(종일 먼저, 그다음 시각순)과
  같은 규칙을 화면에서도 지키기 위한 값이라, 빈 문자열이 곧 '종일' 이다.

  ── planRow(showDate) ────────────────────────────────────────────────
  일간 뷰와 검색 결과가 함께 쓴다. 둘 다 '내 일정' 이므로 할 수 있는 일이 같아야 한다.

  검색 결과는 한동안 이 줄을 손으로 다시 그리고 있었고, 그래서 이미 어긋나 있었다 -
  체크 상자가 <button> 이 아니라 <span> 이라 눌러도 완료가 되지 않았고(모양은 똑같았다),
  '종일' 표시와 종료 시간이 빠져 있었으며, 액션은 '수정' 하나뿐이었다.
  일정을 찾으러 검색에 들어간 사람이 정작 거기서 아무것도 할 수 없었다.

  차이는 날짜 한 줄뿐이라 그것만 인자로 받는다.

  ── planTime(plan) ───────────────────────────────────────────────────
  시간을 적는 규칙(없으면 '종일', 끝 시각이 있으면 '~' 로 잇기)은 공유 플랜 목록도 쓴다.
  거기까지 통째로 합칠 수는 없다 - 남의 일정이라 완료 토글도 수정도 없어야 한다.
  그래서 '모양이 같아야 하는 조각' 만 떼어 함께 쓴다.
-->
<li th:fragment="planRow(showDate)" class="plan-card"
    th:classappend="${plan.completed} ? 'done'"
    th:with="startText=${plan.startTime != null ? #temporals.format(plan.startTime, 'HH:mm') : ''}"
    th:attr="data-plan-id=${plan.id},data-start=${startText}">

    <!-- JS 가 가로채고, 없으면 이 폼이 제출된다 -->
    <form th:action="@{/plans/{id}/toggle(id=${plan.id})}" method="post" class="inline-form">
        <button type="submit" class="check"
                th:with="checkLabel=${(plan.completed ? '완료 취소: ' : '완료로 표시: ') + plan.title}"
                th:attr="data-toggle=${plan.id},aria-label=${checkLabel}"
                th:text="${plan.completed} ? '✅' : '⬜'"></button>
    </form>

    <div class="plan-main">
        <!-- 검색 결과처럼 여러 날짜가 섞인 목록에서만 날짜를 적는다. 일간 뷰는 화면 제목이 이미 날짜다 -->
        <div class="plan-date" th:if="${showDate}">
            <a th:href="@{/plans/daily(date=${plan.planDate})}"
               th:text="${#temporals.format(plan.planDate, 'yyyy-MM-dd (E)')}">날짜</a>
        </div>
        <div th:replace="~{plans/row :: planTime(${plan})}"></div>
        <div class="plan-title" th:text="${plan.title}">제목</div>
        <div class="plan-content" th:if="${plan.content != null && !plan.content.isBlank()}"
             th:text="${plan.content}"></div>
        <div class="plan-meta">
            <span class="tag-category" th:text="${plan.category.label}">분류</span>
            <span class="tag-repeat" th:if="${plan.partOfSeries}">🔁 반복</span>
            <span class="tag-shared" th:if="${plan.shared}"
                  th:text="${plan.shareScope.label}">공유 범위</span>
        </div>
    </div>

    <!--
      자주 쓰는 것만 밖에 두고 나머지는 접는다.
      버튼 여섯 개가 나란히 있으면 좁은 화면에서 카드가 두 줄로 늘어나 목록을 훑기 어렵다.
      <details> 를 쓰는 이유는 열고 닫기·키보드·스크린리더를 브라우저가 이미 처리해 주기 때문이다.
    -->
    <div class="actions">
        <button type="button" class="btn btn-sm btn-timer"
                th:attr="data-timer-start=${plan.id}">▶ 시작</button>

        <details class="row-more">
            <summary class="btn btn-sm" th:attr="aria-label=${'더 보기: ' + plan.title}">⋯</summary>
            <div class="row-more-panel">
                <!-- 3단계라 토글로는 표현할 수 없다. JS 가 없으면 '변경' 버튼으로 제출된다 -->
                <form class="share-form" th:action="@{/plans/{id}/share(id=${plan.id})}" method="post">
                    <label class="sr-only" th:for="'scope-' + ${plan.id}">공유 범위</label>
                    <select class="share-select" name="scope" th:id="'scope-' + ${plan.id}">
                        <option th:each="scope : ${shareScopes}"
                                th:value="${scope}" th:text="${scope.label}"
                                th:selected="${scope == plan.shareScope}"></option>
                    </select>
                    <button type="submit" class="btn btn-sm">변경</button>
                </form>
                <a class="btn btn-sm" th:href="@{/plans/{id}/edit(id=${plan.id})}">수정</a>
                <form th:action="@{/plans/{id}/delete(id=${plan.id})}" method="post"
                      data-confirm="일정을 삭제할까요?" data-confirm-label="삭제">
                    <button type="submit" class="btn btn-sm btn-danger">삭제</button>
                </form>
                <form th:if="${plan.partOfSeries}" th:action="@{/plans/{id}/delete-series(id=${plan.id})}"
                      method="post"
                      data-confirm="이 반복 일정 전체를 삭제할까요?&#10;되돌릴 수 없습니다."
                      data-confirm-label="모두 삭제">
                    <button type="submit" class="btn btn-sm btn-danger">반복 전체 삭제</button>
                </form>
            </div>
        </details>
    </div>
</li>

<!--
  시간 한 줄. 시작 시각이 없으면 '종일' 이고, 끝 시각이 있으면 '~' 로 잇는다.

  이 규칙이 목록마다 따로 적혀 있던 탓에 같은 일정이 화면마다 다르게 보였다 -
  일간 뷰만 '종일' 과 종료 시각을 보여 주고 검색·공유 목록은 시작 시각만 보여 주거나
  아무것도 보여 주지 않았다.
-->
<div th:fragment="planTime(plan)" class="plan-time"
     th:with="startText=${plan.startTime != null ? #temporals.format(plan.startTime, 'HH:mm') : ''}"
     th:text="${plan.startTime == null}
              ? '종일'
              : (${plan.endTime != null}
                 ? |${startText} ~ ${#temporals.format(plan.endTime, 'HH:mm')}|
                 : ${startText})">시간</div>
</body>
</html>
