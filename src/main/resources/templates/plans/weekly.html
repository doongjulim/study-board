<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('플래너 - 주간', 'plans', ~{::main})}">
<body>
<main class="container container-wide">
    <div th:if="${message}" class="flash" th:text="${message}"></div>

    <nav class="view-tabs">
        <a th:href="@{/plans/daily(date=${date})}">일간</a>
        <a class="on" th:href="@{/plans/weekly(date=${date})}">주간</a>
        <a th:href="@{/plans/monthly(month=${#temporals.format(date, 'yyyy-MM')})}">월간</a>
        <a th:href="@{/plans/search}">검색</a>
    </nav>

    <div class="plan-nav">
        <a class="btn" th:href="@{/plans/weekly(date=${prevWeek})}">← 이전 주</a>
        <h2 th:text="|${#temporals.format(weekStart, 'M월 d일')} ~ ${#temporals.format(weekStart.plusDays(6), 'M월 d일')}|">주간</h2>
        <div class="btn-group">
            <a class="btn" th:href="@{/plans/weekly}">이번 주</a>
            <a class="btn" th:href="@{/plans/weekly(date=${nextWeek})}">다음 주 →</a>
        </div>
    </div>

    <div class="toolbar">
        <span class="hint">이번 주 학습 기록을 게시판에 인증글로 남겨보세요.</span>
        <!--
          지난주 복사. 취준 공부는 주 단위로 비슷하게 반복되는데 '매주' 반복 설정으로는
          "지난주 그대로" 를 만들 수 없었다. 같은 요일로 옮기고, 같은 자리에 같은 제목이
          이미 있으면 건너뛴다 - 두 번 눌러도 두 벌이 되지 않는다.
        -->
        <form th:action="@{/plans/copy-week}" method="post"
              data-confirm="지난주 계획을 이번 주 같은 요일로 가져올까요?" data-confirm-label="가져오기">
            <input type="hidden" name="week" th:value="${weekStart}">
            <button type="submit" class="btn">지난주 계획 가져오기</button>
        </form>
        <a class="btn btn-primary" th:href="@{/posts/new(week=${weekStart})}">📝 주간 인증글 쓰기</a>
    </div>

    <div class="scroll-x">
    <div class="week-grid">
        <div class="week-day" th:each="day : ${weekDays}" th:classappend="${day == today} ? 'today'">
            <h3>
                <a th:href="@{/plans/daily(date=${day})}"
                   th:text="${#temporals.format(day, 'M/d (E)')}">날짜</a>
            </h3>
            <!--
              칸의 생김새는 plans/row.html 한 곳에만 있다 - 아래 한 줄 입력으로 추가한 일정도
              같은 조각을 서버에서 받아 끼운다.
              (th:each 와 th:replace 를 한 태그에 같이 쓰면 replace 가 먼저 처리돼 each 가 사라지므로 감싼다)
            -->
            <div class="week-plans">
                <th:block th:each="plan : ${plansByDate.get(day)}">
                    <div th:replace="~{plans/row :: weekPlan}"></div>
                </th:block>
            </div>

            <!--
              한 주를 짜는 자리. 예전에는 '+ 추가' 링크였고, 누르면 작성 폼으로 나갔다 -
              일곱 칸을 채우려면 일곱 번 나갔다 돌아와야 했으니 사실상 조회 화면이었다.

              JS 가 없으면 이 폼이 그대로 제출된다. 그때 주간 뷰로 돌아오도록 view 를 함께 보낸다 -
              한 주를 짜던 사람이 일간 뷰로 튕겨 나가면 흐름이 끊긴다.
            -->
            <form class="week-add" method="post" th:action="@{/plans}" th:attr="data-date=${day}">
                <input type="hidden" name="planDate" th:value="${day}">
                <input type="hidden" name="repeatType" value="NONE">
                <input type="hidden" name="category" value="ETC">
                <input type="hidden" name="view" value="weekly">
                <label class="sr-only" th:for="'week-add-' + ${day}"
                       th:text="|${#temporals.format(day, 'M월 d일')} 할 일 추가|">할 일 추가</label>
                <input type="text" class="week-add-input" name="title" th:id="'week-add-' + ${day}"
                       placeholder="+ 추가" maxlength="100" autocomplete="off">
            </form>
        </div>
    </div>
    </div>

    <!-- 그 주 하루 회고를 모아 두면, 주간 회고를 쓸 때 무슨 일이 있었는지 되짚을 수 있다 -->
    <div class="form-card" th:if="${!dailyRetros.isEmpty()}">
        <h3 class="stat-title">이번 주 하루 회고</h3>
        <ul class="retro-lines">
            <li th:each="line : ${dailyRetros}">
                <a class="retro-date" th:href="@{/plans/daily(date=${line.targetDate})}"
                   th:text="${#temporals.format(line.targetDate, 'M/d (E)')}">날짜</a>
                <span th:text="${line.content}">내용</span>
            </li>
        </ul>
    </div>

    <section th:replace="~{fragments/retro :: retroBox(${retro}, ${retroType}, ${weekStart})}"></section>

    <script th:src="@{/js/week-plan.js}" defer></script>
</main>
</body>
</html>
