<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('플래너 - 일간', 'plans', ~{::main})}">
<body>
<main class="container">
    <div th:if="${message}" class="flash" th:text="${message}"></div>

    <div class="dday-strip" th:if="${!upcomingDdays.isEmpty()}">
        <a class="dday-chip" th:each="dday : ${upcomingDdays}" th:href="@{/ddays}">
            <span class="dday-badge" th:text="${dday.label(today)}">D-0</span>
            <span th:text="${dday.title}">제목</span>
        </a>
    </div>

    <nav class="view-tabs">
        <a class="on" th:href="@{/plans/daily(date=${date})}">일간</a>
        <a th:href="@{/plans/weekly(date=${date})}">주간</a>
        <a th:href="@{/plans/monthly(month=${#temporals.format(date, 'yyyy-MM')})}">월간</a>
    </nav>

    <div class="plan-nav">
        <a class="btn" th:href="@{/plans/daily(date=${prevDate})}">← 이전 날</a>
        <h2 th:text="${#temporals.format(date, 'yyyy년 M월 d일 (E)')}"
            th:classappend="${date == today} ? 'accent'">날짜</h2>
        <div class="btn-group">
            <a class="btn" th:href="@{/plans/daily}">오늘</a>
            <a class="btn" th:href="@{/plans/daily(date=${nextDate})}">다음 날 →</a>
        </div>
    </div>

    <div class="toolbar">
        <span class="hint" th:text="|총 ${plans.size()}개 일정|"></span>
        <a class="btn btn-primary" th:href="@{/plans/new(date=${date})}">+ 일정 추가</a>
    </div>

    <ul class="plan-list">
        <li th:if="${plans.isEmpty()}" class="empty plan-empty">등록된 일정이 없습니다.</li>
        <li th:each="plan : ${plans}" class="plan-card" th:classappend="${plan.completed} ? 'done'">
            <form th:action="@{/plans/{id}/toggle(id=${plan.id})}" method="post">
                <button type="submit" class="check" title="완료 상태 전환"
                        th:text="${plan.completed} ? '✅' : '⬜'"></button>
            </form>
            <div class="plan-main">
                <div class="plan-time" th:if="${plan.startTime == null}">종일</div>
                <div class="plan-time" th:if="${plan.startTime != null}"
                     th:with="start=${#temporals.format(plan.startTime, 'HH:mm')}"
                     th:text="${plan.endTime != null} ? |${start} ~ ${#temporals.format(plan.endTime, 'HH:mm')}| : ${start}"></div>
                <div class="plan-title" th:text="${plan.title}">제목</div>
                <div class="plan-content" th:if="${plan.content != null && !plan.content.isBlank()}"
                     th:text="${plan.content}"></div>
                <div class="plan-meta">
                    <span class="tag-category" th:text="${plan.category.label}">분류</span>
                    <span class="tag-repeat" th:if="${plan.partOfSeries}">🔁 반복</span>
                    <span th:text="${plan.author.nickname}">작성자</span>
                    <span class="tag-shared" th:if="${plan.shared}">공유됨</span>
                </div>
            </div>
            <div class="actions">
                <!-- 계획한 시간이 아니라 실제 공부한 시간을 재는 버튼 (timer.js 가 처리) -->
                <button type="button" class="btn btn-sm btn-timer"
                        th:attr="data-timer-start=${plan.id}">▶ 시작</button>
                <form th:action="@{/plans/{id}/share(id=${plan.id})}" method="post">
                    <button type="submit" class="btn btn-sm"
                            th:text="${plan.shared} ? '공유 해제' : '공유'"></button>
                </form>
                <a class="btn btn-sm" th:href="@{/plans/{id}/edit(id=${plan.id})}">수정</a>
                <form th:action="@{/plans/{id}/delete(id=${plan.id})}" method="post"
                      onsubmit="return confirm('일정을 삭제할까요?');">
                    <button type="submit" class="btn btn-sm btn-danger">삭제</button>
                </form>
                <form th:if="${plan.partOfSeries}" th:action="@{/plans/{id}/delete-series(id=${plan.id})}"
                      method="post" onsubmit="return confirm('이 반복 일정 전체를 삭제할까요?');">
                    <button type="submit" class="btn btn-sm btn-danger">반복 전체 삭제</button>
                </form>
            </div>
        </li>
    </ul>
</main>
</body>
</html>
