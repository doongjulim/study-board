<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('플래너 - 일간', 'plans', ~{::main})}">
<body>
<main class="container">
    <div th:if="${message}" class="flash" th:text="${message}"></div>

    <div class="dday-strip" th:if="${!upcomingDdays.isEmpty()}">
        <a class="dday-chip" th:each="dday : ${upcomingDdays}" th:href="@{/ddays}">
            <span class="dday-badge" th:text="${dday.label(today)}">D-0</span>
            <span th:text="${dday.title}">제목</span>
        </a>
    </div>

    <nav class="view-tabs">
        <a class="on" th:href="@{/plans/daily(date=${date})}">일간</a>
        <a th:href="@{/plans/weekly(date=${date})}">주간</a>
        <a th:href="@{/plans/monthly(month=${#temporals.format(date, 'yyyy-MM')})}">월간</a>
        <a th:href="@{/plans/search}">검색</a>
    </nav>

    <div class="plan-nav">
        <a class="btn" th:href="@{/plans/daily(date=${prevDate})}">← 이전 날</a>
        <h2 th:text="${#temporals.format(date, 'yyyy년 M월 d일 (E)')}"
            th:classappend="${date == today} ? 'accent'">날짜</h2>
        <div class="btn-group">
            <a class="btn" th:href="@{/plans/daily}">오늘</a>
            <a class="btn" th:href="@{/plans/daily(date=${nextDate})}">다음 날 →</a>
        </div>
    </div>

    <!-- data-date: plans.js 가 어느 날짜를 다루는지 알기 위한 값 -->
    <div id="plan-board" th:attr="data-date=${date}">

        <!-- 어제 남긴 일정 안내 (JS 가 없으면 이 폼이 그대로 동작한다) -->
        <form class="leftover" th:if="${leftoverCount > 0}"
              method="post" th:action="@{/plans/rollover}">
            <input type="hidden" name="from" th:value="${prevDate}">
            <input type="hidden" name="to" th:value="${date}">
            <span th:text="|어제 못 끝낸 일정이 ${leftoverCount}개 있어요|">어제 남은 일정</span>
            <button type="submit" id="rollover" class="btn btn-sm"
                    th:attr="data-from=${prevDate}">오늘로 가져오기</button>
        </form>

        <!-- 한 줄 추가: 떠오른 할 일을 그 자리에서 적는다 -->
        <form id="quick-add" class="quick-add" method="post" th:action="@{/plans}">
            <input type="hidden" name="planDate" th:value="${date}">
            <input type="hidden" name="repeatType" value="NONE">
            <label class="sr-only" for="quick-title">할 일</label>
            <input type="text" id="quick-title" name="title" class="search-input quick-title"
                   placeholder="할 일을 적고 Enter" maxlength="100" autocomplete="off">
            <label class="sr-only" for="quick-category">분류</label>
            <select id="quick-category" name="category" class="select-input">
                <option th:each="c : ${categories}" th:value="${c}" th:text="${c.label}"></option>
            </select>
            <button type="submit" class="btn btn-primary">추가</button>
        </form>

        <div class="toolbar">
            <span class="hint" id="plan-counter"
                  th:text="${progress.totalCount() == 0}
                           ? '등록된 일정이 없습니다'
                           : |총 ${progress.totalCount()}개 · ${progress.completedCount()}개 완료 (${progress.completionRate()}%)|">
                진행 상황</span>
            <a class="btn btn-sm" th:href="@{/plans/new(date=${date})}">자세히 입력</a>
        </div>

        <ul class="plan-list" id="plan-list">
            <li th:if="${plans.isEmpty()}" class="empty plan-empty">
                위에 한 줄만 적어도 바로 등록됩니다.
            </li>
            <!--
              한 줄의 생김새는 plans/row.html 한 곳에만 있다.
              (th:each 와 th:replace 를 한 태그에 같이 쓰면 replace 가 먼저 처리돼 each 가 사라지므로 감싼다)
            -->
            <th:block th:each="plan : ${plans}">
                <th:block th:replace="~{plans/row :: planRow}"></th:block>
            </th:block>
        </ul>
    </div>

    <section th:replace="~{fragments/retro :: retroBox(${retro}, ${retroType}, ${date})}"></section>
</main>
</body>
</html>
