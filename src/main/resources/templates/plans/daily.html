<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('플래너 - 일간', 'plans', ~{::main})}">
<body>
<main class="container">
    <div th:if="${message}" class="flash" th:text="${message}"></div>

    <div class="dday-strip" th:if="${!upcomingDdays.isEmpty()}">
        <a class="dday-chip" th:each="dday : ${upcomingDdays}" th:href="@{/ddays}">
            <span class="dday-badge" th:text="${dday.label(today)}">D-0</span>
            <span th:text="${dday.title}">제목</span>
        </a>
    </div>

    <nav class="view-tabs">
        <a class="on" th:href="@{/plans/daily(date=${date})}">일간</a>
        <a th:href="@{/plans/weekly(date=${date})}">주간</a>
        <a th:href="@{/plans/monthly(month=${#temporals.format(date, 'yyyy-MM')})}">월간</a>
        <a th:href="@{/plans/search}">검색</a>
    </nav>

    <div class="plan-nav">
        <a class="btn" th:href="@{/plans/daily(date=${prevDate})}">← 이전 날</a>
        <h2 th:text="${#temporals.format(date, 'yyyy년 M월 d일 (E)')}"
            th:classappend="${date == today} ? 'accent'">날짜</h2>
        <div class="btn-group">
            <a class="btn" th:href="@{/plans/daily}">오늘</a>
            <a class="btn" th:href="@{/plans/daily(date=${nextDate})}">다음 날 →</a>
        </div>
    </div>

    <!-- data-date: plans.js 가 어느 날짜를 다루는지 알기 위한 값 -->
    <div id="plan-board" th:attr="data-date=${date}">

        <!-- 어제 남긴 일정 안내 (JS 가 없으면 이 폼이 그대로 동작한다) -->
        <form class="leftover" th:if="${leftoverCount > 0}"
              method="post" th:action="@{/plans/rollover}">
            <input type="hidden" name="from" th:value="${prevDate}">
            <input type="hidden" name="to" th:value="${date}">
            <span th:text="|어제 못 끝낸 일정이 ${leftoverCount}개 있어요|">어제 남은 일정</span>
            <button type="submit" id="rollover" class="btn btn-sm"
                    th:attr="data-from=${prevDate}">오늘로 가져오기</button>
        </form>

        <!-- 한 줄 추가: 떠오른 할 일을 그 자리에서 적는다 -->
        <form id="quick-add" class="quick-add" method="post" th:action="@{/plans}">
            <input type="hidden" name="planDate" th:value="${date}">
            <input type="hidden" name="repeatType" value="NONE">
            <input type="text" name="title" class="search-input quick-title"
                   placeholder="할 일을 적고 Enter" maxlength="100" autocomplete="off">
            <select name="category" class="select-input">
                <option th:each="c : ${categories}" th:value="${c}" th:text="${c.label}"></option>
            </select>
            <button type="submit" class="btn btn-primary">추가</button>
        </form>

        <div class="toolbar">
            <span class="hint" id="plan-counter"
                  th:text="${progress.totalCount() == 0}
                           ? '등록된 일정이 없습니다'
                           : |총 ${progress.totalCount()}개 · ${progress.completedCount()}개 완료 (${progress.completionRate()}%)|">
                진행 상황</span>
            <a class="btn btn-sm" th:href="@{/plans/new(date=${date})}">자세히 입력</a>
        </div>

        <ul class="plan-list" id="plan-list">
            <li th:if="${plans.isEmpty()}" class="empty plan-empty">
                위에 한 줄만 적어도 바로 등록됩니다.
            </li>
            <li th:each="plan : ${plans}" class="plan-card"
                th:classappend="${plan.completed} ? 'done'" th:attr="data-plan-id=${plan.id}">

                <!-- JS 가 가로채고, 없으면 이 폼이 제출된다 -->
                <form th:action="@{/plans/{id}/toggle(id=${plan.id})}" method="post" class="inline-form">
                    <button type="submit" class="check" title="완료 상태 전환"
                            th:attr="data-toggle=${plan.id}"
                            th:text="${plan.completed} ? '✅' : '⬜'"></button>
                </form>

                <div class="plan-main">
                    <div class="plan-time" th:if="${plan.startTime == null}">종일</div>
                    <div class="plan-time" th:if="${plan.startTime != null}"
                         th:with="start=${#temporals.format(plan.startTime, 'HH:mm')}"
                         th:text="${plan.endTime != null} ? |${start} ~ ${#temporals.format(plan.endTime, 'HH:mm')}| : ${start}"></div>
                    <div class="plan-title" th:text="${plan.title}">제목</div>
                    <div class="plan-content" th:if="${plan.content != null && !plan.content.isBlank()}"
                         th:text="${plan.content}"></div>
                    <div class="plan-meta">
                        <span class="tag-category" th:text="${plan.category.label}">분류</span>
                        <span class="tag-repeat" th:if="${plan.partOfSeries}">🔁 반복</span>
                        <span class="tag-shared" th:if="${plan.shared}"
                              th:text="${plan.shareScope.label}">공유 범위</span>
                    </div>
                </div>

                <div class="actions">
                    <button type="button" class="btn btn-sm btn-timer"
                            th:attr="data-timer-start=${plan.id}">▶ 시작</button>
                    <!-- 3단계라 토글로는 표현할 수 없다. 고르면 바로 반영한다(JS 없으면 '변경' 버튼으로) -->
                    <form class="share-form" th:action="@{/plans/{id}/share(id=${plan.id})}" method="post">
                        <label class="sr-only" th:for="'scope-' + ${plan.id}">공유 범위</label>
                        <select class="share-select" name="scope" th:id="'scope-' + ${plan.id}">
                            <option th:each="scope : ${shareScopes}"
                                    th:value="${scope}" th:text="${scope.label}"
                                    th:selected="${scope == plan.shareScope}"></option>
                        </select>
                        <button type="submit" class="btn btn-sm">변경</button>
                    </form>
                    <a class="btn btn-sm" th:href="@{/plans/{id}/edit(id=${plan.id})}">수정</a>
                    <form th:action="@{/plans/{id}/delete(id=${plan.id})}" method="post"
                          onsubmit="return confirm('일정을 삭제할까요?');">
                        <button type="submit" class="btn btn-sm btn-danger">삭제</button>
                    </form>
                    <form th:if="${plan.partOfSeries}" th:action="@{/plans/{id}/delete-series(id=${plan.id})}"
                          method="post" onsubmit="return confirm('이 반복 일정 전체를 삭제할까요?');">
                        <button type="submit" class="btn btn-sm btn-danger">반복 전체 삭제</button>
                    </form>
                </div>
            </li>
        </ul>
    </div>
</main>
</body>
</html>
