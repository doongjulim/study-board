<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(${post.title}, 'posts', ~{::main})}">
<body>
<main class="container">
    <div th:if="${message}" class="flash" th:text="${message}"></div>

    <h1 class="post-title">
        <span class="tag-category" th:text="${post.category.label}">분류</span>
        <span th:text="${post.title}">제목</span>
    </h1>
    <div class="post-meta">
        <span th:text="'작성자: ' + ${post.author.nickname}"></span>
        <span th:text="'조회 ' + ${post.viewCount}"></span>
        <span th:text="'작성일: ' + ${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
        <span th:if="${post.updatedAt != null and !post.updatedAt.equals(post.createdAt)}"
              th:text="'수정일: ' + ${#temporals.format(post.updatedAt, 'yyyy-MM-dd HH:mm')}"></span>
    </div>

    <!--
      마크다운을 그린 HTML 이라 utext 로 넣는다.
      이 값은 MarkdownRenderer 가 허용 목록으로 살균한 뒤에만 모델에 담긴다 - 원문을 그대로 넣으면 XSS 다.
    -->
    <div class="post-body markdown" th:utext="${contentHtml}">내용</div>

    <!-- 좋아요: 로그인한 사람만 누를 수 있고, 내가 누른 상태가 바로 보여야 한다 -->
    <div class="like-box">
        <form th:if="${currentMember != null}" th:action="@{/posts/{id}/like(id=${post.id})}" method="post">
            <button type="submit" class="btn like-btn" th:classappend="${liked} ? 'on'"
                    th:text="(${liked} ? '♥ 좋아요 ' : '♡ 좋아요 ') + ${post.likeCount}">♡ 좋아요 0</button>
        </form>
        <span th:if="${currentMember == null}" class="like-btn muted"
              th:text="'♡ 좋아요 ' + ${post.likeCount}">♡ 좋아요 0</span>
    </div>

    <div class="attach" th:if="${!post.files.isEmpty()}">
        <h3>첨부파일</h3>
        <ul>
            <li th:each="file : ${post.files}">
                <a th:href="@{/files/{id}/download(id=${file.id})}" th:text="${file.originalName}">파일명</a>
                <span class="size" th:text="'(' + ${#numbers.formatDecimal(file.size / 1024.0, 1, 1)} + ' KB)'"></span>
            </li>
        </ul>
        <!-- 이미지 파일은 본문 아래에 미리보기로 표시 -->
        <th:block th:each="file : ${post.files}">
            <img th:if="${file.isImage()}" th:src="@{/files/{id}/view(id=${file.id})}"
                 th:alt="${file.originalName}">
        </th:block>
    </div>

    <div class="actions">
        <a th:href="@{/posts}" class="btn">목록</a>
        <!-- 수정/삭제는 작성자 본인에게만 노출 (서버에서도 소유권을 재검증한다) -->
        <th:block th:if="${currentMember != null and currentMember.id == post.author.id}">
            <a th:href="@{/posts/{id}/edit(id=${post.id})}" class="btn">수정</a>
            <form th:action="@{/posts/{id}/delete(id=${post.id})}" method="post"
                  data-confirm="게시글을 삭제할까요?&#10;댓글과 첨부파일도 함께 사라집니다." data-confirm-label="삭제">
                <button type="submit" class="btn btn-danger">삭제</button>
            </form>
        </th:block>
    </div>

    <div th:replace="~{fragments/comments :: commentSection(${comments}, '/posts/' + ${post.id} + '/comments')}"></div>
</main>
</body>
</html>
