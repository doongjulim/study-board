<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('게시판', 'posts', ~{::main})}">
<body>
<main class="container">
    <div th:if="${message}" class="flash" th:text="${message}"></div>

    <!--
      분류 필터. 플래너의 view-tabs 와 생김새는 같지만 하는 일이 다르다 -
      저쪽은 화면을 바꾸고 이쪽은 목록을 거른다. 클래스와 aria-label 로 그 차이를 남긴다
      (filter-tabs 는 view-tabs 의 모양을 그대로 쓴다).
    -->
    <nav class="view-tabs filter-tabs" aria-label="분류 필터">
        <a th:href="@{/posts(keyword=${keyword}, searchType=${searchType}, sort=${sort})}"
           th:classappend="${category == null} ? 'on'">전체</a>
        <a th:each="item : ${categories}"
           th:href="@{/posts(category=${item}, keyword=${keyword}, searchType=${searchType}, sort=${sort})}"
           th:classappend="${item == category} ? 'on'"
           th:text="${item.label}">분류</a>
    </nav>

    <div class="toolbar">
        <form th:action="@{/posts}" method="get" class="search-form">
            <!--
              라벨이 화면에는 없지만 이름은 있어야 한다. placeholder 는 라벨이 아니다 -
              값을 적는 순간 사라지고, 스크린리더는 그 칸이 무엇을 묻는지 알 수 없다.
              (플래너의 한 줄 추가가 쓰는 것과 같은 .sr-only 방식이다)
            -->
            <label class="sr-only" for="post-search-type">검색 범위</label>
            <select id="post-search-type" name="searchType" class="select-input">
                <option th:each="type : ${searchTypes}"
                        th:value="${type}" th:text="${type.label}"
                        th:selected="${type == searchType}"></option>
            </select>
            <label class="sr-only" for="post-keyword">검색어</label>
            <input type="text" id="post-keyword" name="keyword" th:value="${keyword}"
                   placeholder="검색어" class="search-input">
            <!-- 분류 탭에서 고른 값이 검색·정렬에도 이어지도록 폼에 실어 보낸다 -->
            <input type="hidden" name="category" th:if="${category != null}" th:value="${category}">
            <label class="sr-only" for="post-sort">정렬</label>
            <select id="post-sort" name="sort" onchange="this.form.submit()" class="select-input">
                <option value="latest" th:selected="${sort == 'latest'}">최신순</option>
                <option value="oldest" th:selected="${sort == 'oldest'}">오래된순</option>
                <option value="title" th:selected="${sort == 'title'}">제목순</option>
                <option value="popular" th:selected="${sort == 'popular'}">인기순</option>
            </select>
            <button type="submit" class="btn">검색</button>
            <!-- 검색어·분류·정렬을 한 번에 푼다. 입력칸을 비우고 다시 누르게 하지 않는다 -->
            <a th:if="${keyword != null and !keyword.isBlank()}" class="btn" th:href="@{/posts}">조건 초기화</a>
        </form>
        <span class="toolbar-actions">
            <a th:if="${currentMember != null}" th:href="@{/posts/mine}" class="btn">모아보기</a>
            <a th:href="@{/posts/new}" class="btn btn-primary">글쓰기</a>
        </span>
    </div>

    <div th:replace="~{posts/table :: postTable}"></div>

    <!-- 검색·정렬 조건은 페이지를 넘겨도 유지되어야 하므로 기준 URL 에 함께 싣는다 -->
    <th:block th:with="pageUrl=@{/posts(keyword=${keyword}, searchType=${searchType}, sort=${sort}, category=${category})}">
        <nav th:replace="~{fragments/pagination :: pagination(${posts}, ${pageBlock}, ${pageUrl})}"></nav>
    </th:block>
</main>
</body>
</html>
