<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('글쓰기', 'posts', ~{::main})}">
<body>
<main class="container">
    <h1 class="post-title">글쓰기</h1>

    <form class="form-card" th:action="@{/posts}" th:object="${postForm}"
          method="post" enctype="multipart/form-data">
        <div class="form-group">
            <label for="title">제목</label>
            <input type="text" id="title" th:field="*{title}" placeholder="제목을 입력하세요">
            <p class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></p>
        </div>
        <div class="form-group">
            <label for="category">분류</label>
            <select id="category" class="select-input" th:field="*{category}">
                <option th:each="item : ${categories}"
                        th:value="${item}" th:text="${item.label}"></option>
            </select>
        </div>
        <div class="form-group">
            <label for="content">내용</label>
            <textarea id="content" th:field="*{content}"
                      placeholder="내용을 입력하세요 (마크다운으로 씁니다)"></textarea>
            <p class="hint">
                마크다운을 쓸 수 있어요 — <code>**굵게**</code>, <code># 제목</code>,
                <code>- 목록</code>, <code>[링크](주소)</code>, <code>```코드```</code>
            </p>
            <p class="error" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></p>
        </div>
        <div class="form-group">
            <label for="files">첨부파일</label>
            <input type="file" id="files" name="files" multiple>
            <p class="hint">이미지·문서 등 여러 파일을 선택할 수 있습니다. (파일당 최대 10MB)</p>
        </div>
        <div class="actions">
            <button type="submit" class="btn btn-primary">등록</button>
            <a th:href="@{/posts}" class="btn">취소</a>
        </div>
    </form>
</main>
</body>
</html>
