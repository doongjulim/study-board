<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('학습 통계', 'stats', ~{::main})}">
<body>
<main class="container">
    <h2 class="page-title">학습 통계</h2>

    <nav class="view-tabs">
        <a th:classappend="${period == 'week'} ? 'on'" th:href="@{/stats(period='week', date=${date})}">주간</a>
        <a th:classappend="${period == 'month'} ? 'on'" th:href="@{/stats(period='month', date=${date})}">월간</a>
    </nav>

    <div class="plan-nav">
        <a class="btn" th:href="@{/stats(period=${period}, date=${prevDate})}">← 이전</a>
        <h3 th:text="${#temporals.format(statistics.from, 'M월 d일')} + ' ~ ' + ${#temporals.format(statistics.to, 'M월 d일')}">기간</h3>
        <div class="btn-group">
            <a class="btn" th:href="@{/stats(period=${period})}">오늘</a>
            <a class="btn" th:href="@{/stats(period=${period}, date=${nextDate})}">다음 →</a>
        </div>
    </div>

    <!-- 요약 카드 -->
    <section class="stat-cards">
        <div class="stat-card">
            <span class="stat-label">완료율</span>
            <strong class="stat-value" th:text="${statistics.completionRate()} + '%'">0%</strong>
            <span class="stat-sub" th:text="${statistics.completedCount} + ' / ' + ${statistics.totalCount} + '개 완료'">0 / 0</span>
            <!--
              지난 기간이 없으면 비교하지 않는다 - 처음 쓰는 사람에게 "지난주 대비 +12%p" 는
              없던 지난주를 있었던 것처럼 말하는 셈이다(PeriodComparison#hasPrevious).
            -->
            <span class="stat-delta" th:if="${comparison.hasPrevious()}"
                  th:classappend="${comparison.completionRateDelta() > 0} ? 'up'
                                  : (${comparison.completionRateDelta() < 0} ? 'down')"
                  th:text="${comparison.readableCompletionRateDelta()}">지난주 대비</span>
        </div>
        <div class="stat-card">
            <span class="stat-label">공부 시간</span>
            <strong class="stat-value"
                    th:text="${statistics.readableActual()}">0시간</strong>
            <!-- 계획 시간과 나란히 놓아야 "계획을 과하게 잡는지" 가 보인다 -->
            <span class="stat-sub" th:if="${statistics.plannedMinutes > 0}"
                  th:text="'계획 ' + ${statistics.readablePlanned()}
                           + ' 대비 ' + ${statistics.executionRate()} + '%'">계획 대비</span>
            <span class="stat-sub" th:unless="${statistics.plannedMinutes > 0}">타이머로 기록한 실제 시간</span>
            <span class="stat-delta" th:if="${comparison.hasPrevious()}"
                  th:classappend="${comparison.actualIncreased()} ? 'up'
                                  : (${comparison.actualDecreased()} ? 'down')"
                  th:text="${comparison.readableActualDelta()}">지난주 대비</span>
        </div>
        <div class="stat-card">
            <span class="stat-label">연속 달성</span>
            <strong class="stat-value" th:text="${streak} + '일'">0일</strong>
            <span class="stat-sub" th:text="${streak > 0} ? '계속 이어가세요!' : '오늘 목표 시간을 채워 보세요'">-</span>
        </div>
        <div class="stat-card">
            <span class="stat-label">남은 계획</span>
            <strong class="stat-value" th:text="${statistics.totalCount - statistics.completedCount} + '개'">0개</strong>
            <span class="stat-sub" th:text="${periodLabel} + ' 기준'">기준</span>
        </div>
    </section>

    <!-- 계획만 세우고 타이머를 한 번도 쓰지 않은 경우 -->
    <p class="flash" th:if="${statistics.totalCount > 0 and statistics.hasNoStudyRecord()}">
        아직 이 기간에 기록된 학습 시간이 없어요.
        플래너에서 <strong>▶ 시작</strong> 을 누르면 실제 공부한 시간이 여기에 쌓입니다.
    </p>

    <!-- 일별 추이 -->
    <section class="stat-section">
        <h3 class="stat-title">일별 달성률</h3>
        <p class="empty" th:if="${statistics.totalCount == 0 and statistics.actualMinutes == 0}">
            이 기간에 등록된 계획도 학습 기록도 없습니다.</p>
        <!-- th:if 를 th:replace 와 한 태그에 두면 replace 가 먼저 처리돼 조건이 무시된다 -->
        <th:block th:if="${statistics.totalCount > 0 or statistics.actualMinutes > 0}">
            <div th:replace="~{fragments/trend :: trendChart(${statistics.dailyTrend})}"></div>
        </th:block>
    </section>

    <!-- 분류별 집계 -->
    <section class="stat-section" th:if="${statistics.totalCount > 0}">
        <h3 class="stat-title">분류별 학습량</h3>
        <ul class="category-list">
            <li th:each="stat : ${statistics.categories}" class="category-row">
                <div class="category-head">
                    <span class="tag-category" th:text="${stat.category.label}">분류</span>
                    <span class="category-time"
                          th:text="${stat.readableActual()}">시간</span>
                    <span class="category-count"
                          th:text="${stat.completedCount} + '/' + ${stat.totalCount} + '개 · ' + ${stat.completionRate()} + '%'">개수</span>
                </div>
                <div class="category-bar-wrap">
                    <div class="category-bar" th:style="'width:' + ${stat.share} + '%'"></div>
                </div>
            </li>
        </ul>
    </section>
</main>
</body>
</html>
