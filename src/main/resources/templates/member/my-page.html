<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('내 정보', 'me', ~{::main})}">
<body>
<main class="container">
    <div th:if="${message}" class="flash" th:text="${message}"></div>

    <h2 class="page-title">내 정보</h2>
    <p class="hint">
        <span th:text="'아이디 ' + ${member.loginId}">아이디</span> ·
        <span th:text="${#temporals.format(member.createdAt, 'yyyy년 M월 d일')} + ' 가입'">가입일</span>
    </p>

    <!-- 프로필 -->
    <form class="form-card" method="post" th:object="${profileForm}" th:action="@{/me/profile}">
        <h3 class="stat-title">프로필</h3>

        <div class="form-group">
            <label for="nickname">닉네임</label>
            <input type="text" id="nickname" th:field="*{nickname}">
            <p class="error" th:if="${#fields.hasErrors('nickname')}" th:errors="*{nickname}"></p>
        </div>

        <div class="form-group">
            <label for="email">이메일</label>
            <input type="email" id="email" th:field="*{email}" placeholder="비워 두어도 됩니다">
            <p class="hint">비밀번호를 잊었을 때 재설정 링크를 받을 주소입니다.</p>
            <p class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
        </div>

        <div class="form-group">
            <label for="dailyGoalMinutes">하루 목표 학습 시간 (분)</label>
            <input type="number" id="dailyGoalMinutes" th:field="*{dailyGoalMinutes}" min="0" max="1440" step="5">
            <p class="hint">이 시간을 실제로 채운 날만 연속 달성으로 셉니다. 0 으로 두면 계획 완료만으로 판정해요.</p>
            <p class="error" th:if="${#fields.hasErrors('dailyGoalMinutes')}" th:errors="*{dailyGoalMinutes}"></p>
        </div>

        <div class="actions">
            <button type="submit" class="btn btn-primary">저장</button>
        </div>
    </form>

    <!-- 알림 -->
    <form class="form-card" method="post" th:object="${notificationSettingForm}"
          th:action="@{/me/notifications}">
        <h3 class="stat-title">알림</h3>

        <div class="form-group check-row">
            <label>
                <input type="checkbox" th:field="*{reminderEnabled}">
                일정 시작 전 리마인더 받기
            </label>
        </div>

        <div class="form-group">
            <label for="reminderLeadMinutes">몇 분 전에 알릴까요</label>
            <input type="number" id="reminderLeadMinutes" th:field="*{reminderLeadMinutes}"
                   min="0" max="60" step="5">
            <p class="hint">0 으로 두면 시작 시각에 알립니다. 최대 60분 전까지 가능합니다.</p>
            <p class="error" th:if="${#fields.hasErrors('reminderLeadMinutes')}"
               th:errors="*{reminderLeadMinutes}"></p>
        </div>

        <div class="form-group check-row">
            <label>
                <input type="checkbox" th:field="*{planSharedEnabled}">
                다른 회원이 플랜을 공유했을 때 알림 받기
            </label>
        </div>

        <div class="form-group check-row">
            <label>
                <input type="checkbox" th:field="*{commentEnabled}">
                내 글·플랜에 댓글이 달렸을 때 알림 받기
            </label>
        </div>

        <div class="actions">
            <button type="submit" class="btn btn-primary">알림 설정 저장</button>
        </div>
    </form>

    <!-- 비밀번호 -->
    <form class="form-card" method="post" th:object="${passwordChangeForm}" th:action="@{/me/password}">
        <h3 class="stat-title">비밀번호 변경</h3>
        <p class="hint">변경하면 <strong>모든 기기에서 로그아웃</strong>되고 다시 로그인해야 합니다.</p>

        <div class="form-group">
            <label for="currentPassword">현재 비밀번호</label>
            <input type="password" id="currentPassword" th:field="*{currentPassword}"
                   autocomplete="current-password">
            <p class="error" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></p>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="newPassword">새 비밀번호</label>
                <input type="password" id="newPassword" th:field="*{newPassword}"
                       autocomplete="new-password" placeholder="8자 이상">
                <p class="error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></p>
            </div>
            <div class="form-group">
                <label for="newPasswordConfirm">새 비밀번호 확인</label>
                <input type="password" id="newPasswordConfirm" th:field="*{newPasswordConfirm}"
                       autocomplete="new-password">
                <p class="error" th:if="${#fields.hasErrors('newPasswordConfirm')}"
                   th:errors="*{newPasswordConfirm}"></p>
            </div>
        </div>

        <div class="actions">
            <button type="submit" class="btn btn-primary">비밀번호 변경</button>
        </div>
    </form>

    <!-- 탈퇴 -->
    <section class="form-card danger-zone">
        <h3 class="stat-title">회원 탈퇴</h3>
        <p class="hint">
            계획·D-Day·학습 기록·알림은 <strong>모두 삭제</strong>됩니다.
            게시글과 댓글은 다른 분들의 대화가 끊기지 않도록 남고, 작성자는 <strong>탈퇴한 회원</strong>으로 표시됩니다.
            되돌릴 수 없습니다.
        </p>

        <form method="post" th:action="@{/me/withdraw}"
              onsubmit="return confirm('정말 탈퇴하시겠습니까? 학습 기록은 모두 삭제되며 되돌릴 수 없습니다.');">
            <div class="form-group">
                <label for="withdrawPassword">확인을 위해 비밀번호를 입력해 주세요</label>
                <input type="password" id="withdrawPassword" name="password" autocomplete="current-password">
            </div>
            <div class="actions">
                <button type="submit" class="btn btn-danger">탈퇴하기</button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
