<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('로그인', 'login', ~{::main})}">
<body>
<main class="container">
    <div th:if="${message}" class="flash" th:text="${message}"></div>
    <!-- 동의를 취소하면 여기로 돌아온다. 오류 화면을 보여 줄 일이 아니다 -->
    <div th:if="${param.error != null and param.error[0] == 'social'}" class="flash">
        소셜 로그인이 끝나지 않았습니다. 다시 시도해 주세요.
    </div>

    <h2 class="page-title">로그인</h2>

    <form class="form-card" method="post" th:object="${loginForm}" th:action="@{/login}">
        <input type="hidden" name="redirect" th:value="${redirect}" th:if="${redirect != null}">

        <p class="error" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}"></p>

        <div class="form-group">
            <label for="loginId">아이디</label>
            <input type="text" id="loginId" th:field="*{loginId}" autocomplete="username" autofocus>
            <p class="error" th:if="${#fields.hasErrors('loginId')}" th:errors="*{loginId}"></p>
        </div>

        <div class="form-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" th:field="*{password}" autocomplete="current-password">
            <p class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
        </div>

        <div class="actions">
            <button type="submit" class="btn btn-primary">로그인</button>
            <a class="btn" th:href="@{/signup}">회원가입</a>
        </div>

        <p class="hint">
            비밀번호를 잊으셨나요? <a th:href="@{/password/forgot}">비밀번호 찾기</a>
        </p>
    </form>

    <!--
      설정된 제공자만 그린다. 자격증명이 없으면 목록이 비고 이 영역 자체가 사라진다 -
      눌러도 오류가 나는 버튼은 없느니만 못하다.

      링크(GET)인 이유: 인가 요청을 시작하는 것은 Spring Security 의 엔드포인트이고,
      우리 폼이 아니라서 CSRF 토큰을 실을 자리가 없다. state 파라미터가 그 역할을 한다.
    -->
    <section class="social-login" th:if="${!socialProviders.isEmpty()}">
        <p class="social-divider"><span>또는</span></p>
        <div class="social-buttons">
            <a th:each="provider : ${socialProviders}" class="btn btn-social"
               th:classappend="'btn-social-' + ${provider.registrationId}"
               th:href="@{/oauth2/authorization/{id}(id=${provider.registrationId})}"
               th:text="${provider.displayName} + '(으)로 로그인'">소셜 로그인</a>
        </div>
        <p class="hint">
            처음이라면 계정이 자동으로 만들어집니다. 아이디·비밀번호는 따로 두지 않습니다.
        </p>
    </section>
</main>
</body>
</html>
