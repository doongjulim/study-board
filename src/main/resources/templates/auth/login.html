<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('로그인', 'login', ~{::main})}">
<body>
<main class="container">
    <div th:if="${message}" class="flash" th:text="${message}"></div>

    <h2 class="page-title">로그인</h2>

    <form class="form-card" method="post" th:object="${loginForm}" th:action="@{/login}">
        <input type="hidden" name="redirect" th:value="${redirect}" th:if="${redirect != null}">

        <p class="error" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}"></p>

        <div class="form-group">
            <label for="loginId">아이디</label>
            <input type="text" id="loginId" th:field="*{loginId}" autocomplete="username" autofocus>
            <p class="error" th:if="${#fields.hasErrors('loginId')}" th:errors="*{loginId}"></p>
        </div>

        <div class="form-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" th:field="*{password}" autocomplete="current-password">
            <p class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
        </div>

        <div class="actions">
            <button type="submit" class="btn btn-primary">로그인</button>
            <a class="btn" th:href="@{/signup}">회원가입</a>
        </div>

        <p class="hint">
            비밀번호를 잊으셨나요? <a th:href="@{/password/forgot}">비밀번호 찾기</a>
        </p>
    </form>
</main>
</body>
</html>
