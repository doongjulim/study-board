<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('새 비밀번호 설정', 'login', ~{::main})}">
<body>
<main class="container">
    <h2 class="page-title">새 비밀번호 설정</h2>

    <form class="form-card" method="post" th:object="${passwordResetForm}" th:action="@{/password/reset}">
        <!-- 링크로 받은 토큰을 그대로 실어 보낸다 -->
        <input type="hidden" th:field="*{token}">

        <p class="hint">새 비밀번호를 정하면 모든 기기에서 로그아웃되고, 이 링크는 즉시 만료됩니다.</p>

        <div class="form-group">
            <label for="newPassword">새 비밀번호</label>
            <input type="password" id="newPassword" th:field="*{newPassword}"
                   autocomplete="new-password" placeholder="8자 이상" autofocus>
            <p class="error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></p>
        </div>

        <div class="form-group">
            <label for="newPasswordConfirm">새 비밀번호 확인</label>
            <input type="password" id="newPasswordConfirm" th:field="*{newPasswordConfirm}"
                   autocomplete="new-password">
            <p class="error" th:if="${#fields.hasErrors('newPasswordConfirm')}"
               th:errors="*{newPasswordConfirm}"></p>
        </div>

        <div class="actions">
            <button type="submit" class="btn btn-primary">비밀번호 변경</button>
        </div>
    </form>
</main>
</body>
</html>
