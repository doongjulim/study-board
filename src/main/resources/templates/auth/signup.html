<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>회원가입</title>
    <link rel="stylesheet" th:href="@{/css/board.css}">
    <script>!function(){var t=localStorage.getItem('theme');t&&document.documentElement.setAttribute('data-theme',t)}();</script>
</head>
<body>
<header th:replace="~{fragments/header :: siteHeader('signup')}"></header>

<main class="container">
    <h2 class="page-title">회원가입</h2>

    <form class="form-card" method="post" th:object="${signupForm}" th:action="@{/signup}">
        <div class="form-group">
            <label for="loginId">아이디</label>
            <input type="text" id="loginId" th:field="*{loginId}" autocomplete="username"
                   placeholder="영문 소문자·숫자 4~20자">
            <p class="error" th:if="${#fields.hasErrors('loginId')}" th:errors="*{loginId}"></p>
        </div>

        <div class="form-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" th:field="*{password}" autocomplete="new-password"
                   placeholder="8자 이상">
            <p class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
        </div>

        <div class="form-group">
            <label for="passwordConfirm">비밀번호 확인</label>
            <input type="password" id="passwordConfirm" th:field="*{passwordConfirm}" autocomplete="new-password">
            <p class="error" th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}"></p>
        </div>

        <div class="form-group">
            <label for="nickname">닉네임</label>
            <input type="text" id="nickname" th:field="*{nickname}" placeholder="2~20자">
            <p class="error" th:if="${#fields.hasErrors('nickname')}" th:errors="*{nickname}"></p>
        </div>

        <div class="actions">
            <button type="submit" class="btn btn-primary">가입하기</button>
            <a class="btn" th:href="@{/login}">로그인으로</a>
        </div>
    </form>
</main>
</body>
</html>
