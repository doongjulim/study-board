<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('비밀번호 찾기', 'login', ~{::main})}">
<body>
<main class="container">
    <div th:if="${message}" class="flash" th:text="${message}"></div>

    <h2 class="page-title">비밀번호 찾기</h2>

    <form class="form-card" method="post" th:action="@{/password/forgot}">
        <p class="hint">
            가입할 때 등록한 이메일 주소를 입력하시면 재설정 링크를 보내 드립니다.
            링크는 30분 동안만 유효합니다.
        </p>

        <div class="form-group">
            <label for="email">이메일</label>
            <input type="email" id="email" name="email" required autofocus
                   autocomplete="email" placeholder="가입할 때 등록한 주소">
        </div>

        <div class="actions">
            <button type="submit" class="btn btn-primary">재설정 링크 받기</button>
            <a class="btn" th:href="@{/login}">로그인으로</a>
        </div>
    </form>

    <p class="hint">
        이메일을 등록하지 않으셨다면 이 방법으로는 되찾을 수 없습니다.
        다음부터는 마이페이지에서 이메일을 등록해 두세요.
    </p>
</main>
</body>
</html>
