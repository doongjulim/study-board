<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('페이지를 찾을 수 없습니다', '', ~{::main})}">
<body>
<main class="container error-page">
    <h1 class="error-code">404</h1>
    <p class="error-desc">요청하신 페이지를 찾을 수 없습니다.</p>
    <p class="error-detail" th:if="${message}" th:text="${message}"></p>
    <a th:href="@{/posts}" class="btn btn-primary">목록으로 돌아가기</a>
</main>
</body>
</html>
