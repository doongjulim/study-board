<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('접근할 수 없습니다', '', ~{::main})}">
<body>
<main class="container error-page">
    <h1 class="error-code">403</h1>
    <p class="error-desc">이 작업을 수행할 권한이 없습니다.</p>
    <p class="error-detail" th:if="${message}" th:text="${message}"></p>
    <a th:href="@{/}" class="btn btn-primary">홈으로 돌아가기</a>
</main>
</body>
</html>
