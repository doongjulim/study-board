<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('서버 오류', '', ~{::main})}">
<body>
<main class="container error-page">
    <h1 class="error-code">500</h1>
    <p class="error-desc">서버에서 오류가 발생했습니다.</p>
    <p class="error-detail" th:if="${message}" th:text="${message}"></p>
    <a th:href="@{/posts}" class="btn btn-primary">목록으로 돌아가기</a>
</main>
</body>
</html>
