# 로컬 개발용 값 (프로필: local)
#
# 프로필을 지정하지 않으면 spring.profiles.default 가 이것을 켠다 -
# 저장소를 받아 ./gradlew bootRun 만 해도 그대로 뜬다.
#
# 반대로 SPRING_PROFILES_ACTIVE 로 다른 프로필을 지정하면 이 파일은 읽히지 않는다.
# 그 순간 jwt.secret 의 기본값이 사라지므로, 환경변수를 빠뜨린 배포는 부팅 단계에서 실패한다.
# "운영에서 바꾸는 것을 잊지 않아야" 하는 구조 대신, 잊으면 뜨지 않는 구조를 택했다.
#
# 소셜 로그인까지 함께 보려면 두 프로필을 같이 켠다:
#   SPRING_PROFILES_ACTIVE=local,oauth ./gradlew bootRun
jwt:
  # 로컬 전용. 공개 저장소에 있는 값이므로 배포에는 절대 쓰이지 않아야 하고,
  # 실제로 local 프로필 밖에서는 읽히지 않는다
  secret: study-board-local-dev-secret-key-please-override
