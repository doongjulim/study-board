spring:
  datasource:
    # 운영에서는 SPRING_DATASOURCE_URL/USERNAME/PASSWORD 환경변수로 덮어쓴다 (PostgreSQL 등).
    # 드라이버 클래스는 적지 않는다 - URL 에서 유추되므로, 적어 두면 DB 를 바꿀 때 같이 고쳐야 한다
    url: jdbc:h2:file:./data/boarddb
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    # 공통 마이그레이션 + 현재 DB 전용 마이그레이션을 함께 읽는다.
    # 부분 인덱스처럼 DB 마다 문법이 갈리는 것만 벤더 쪽에 두고, 나머지는 공통에 둔다.
    #
    # 벤더 폴더를 db/migration 밖에 두는 것이 중요하다 - Flyway 는 location 을 재귀로 훑으므로,
    # db/migration/h2 처럼 안에 두면 공통 위치만으로도 두 벤더의 V11 이 함께 잡혀 버전이 중복된다.
    locations: classpath:db/migration,classpath:db/vendor/{vendor}

  # 소셜 로그인 설정은 application-oauth.yml 에 있다.
  #
  # 여기 두지 않는 이유: client-id 를 빈 값으로 선언하면 Spring Boot 가 부팅 단계에서
  # "Client id must not be empty" 로 실패한다. 자격증명이 없을 때 앱이 아예 뜨지 않는 것보다,
  # 쓸 사람만 프로필을 켜는 편이 낫다.
  #
  #   SPRING_PROFILES_ACTIVE=oauth ./gradlew bootRun
  #
  # 프로필을 켜지 않으면 ClientRegistrationRepository 빈이 없고,
  # SecurityConfig 가 oauth2Login 을 붙이지 않으며, 로그인 화면에 소셜 버튼도 나오지 않는다.

  h2:
    console:
      # 기본값을 꺼 둔다. 켜져 있으면 DB 를 브라우저에서 그대로 열 수 있으므로,
      # 운영에서 끄는 것을 "잊지 않아야" 하는 구조는 언젠가 잊는다.
      # 로컬에서 필요할 때만 H2_CONSOLE_ENABLED=true 로 켠다.
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

server:
  servlet:
    session:
      # 세션 식별자는 쿠키로만 주고받는다.
      #
      # 기본값은 쿠키가 아직 없는 첫 요청에 한해 주소 뒤에 ;jsessionid=... 를 붙이는 것도 허용한다.
      # 그러면 주소를 공유하거나 로그가 남는 순간 세션이 함께 넘어가고, Spring Security 의 요청
      # 방화벽은 경로 안의 ';' 를 거부하므로 그 주소로 온 요청이 전부 400 이 된다.
      #
      # 예전에는 Spring Security 의 세션 관리 설정이 이 재작성을 막아 주고 있었다.
      # 그 설정을 끄면서 가려져 있던 기본값이 드러났으므로, 여기서 명시적으로 끈다.
      tracking-modes: cookie

file:
  # 컨테이너에서는 볼륨 경로로 바꾼다. 환경변수 이름을 명시하는 이유는
  # 완화 바인딩 규칙상 file.upload-dir 의 자동 대응이 FILE_UPLOADDIR 이라 헷갈리기 때문이다
  upload-dir: ${FILE_UPLOAD_DIR:${user.home}/board-uploads/}

app:
  # 비밀번호 재설정·이메일 인증 메일에 담을 링크의 앞부분 - 배포 주소에 맞춰 바꾼다
  base-url: ${APP_BASE_URL:http://localhost:8080}

  cookie:
    # 쿠키에 Secure 를 붙일지. 붙이면 브라우저가 https 에서만 보낸다.
    #
    # 기본값을 false 로 두는 이유: 로컬은 http 라 켜면 인증 쿠키가 아예 실리지 않아
    # 로그인이 조용히 안 된다. 반대로 운영은 https 이므로 반드시 켜야 한다 -
    # 코드가 아니라 환경이 정할 일이라 설정으로 뺐다 (APP_COOKIE_SECURE=true).
    secure: ${APP_COOKIE_SECURE:false}

jwt:
  # 로컬 개발용 시크릿 - 운영 환경에서는 반드시 환경변수(JWT_SECRET)로 교체할 것 (HS256, 32바이트 이상)
  secret: ${JWT_SECRET:study-board-local-dev-secret-key-please-override}
  # 액세스 토큰은 무상태라 폐기할 수 없으므로 짧게, 재로그인은 리프레시 토큰으로 대신한다
  access-token-minutes: 15
  refresh-token-days: 14
